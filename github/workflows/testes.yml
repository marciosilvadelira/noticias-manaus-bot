# Roda os testes automatizados sempre que o código for alterado.
name: Testes

on:
  push:
    paths-ignore:
      - "data/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes automatizados (sem rede, sem publicar nada)
        run: python -m unittest discover -s tests -t . -v
